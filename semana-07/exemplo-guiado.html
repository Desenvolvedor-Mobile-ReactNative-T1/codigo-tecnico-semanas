<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Afora - Exemplo de Tags Semânticas</title>
</head>



<body>
    <!-- HEADER: Cabeçalho do Site Inteiro -->
    <header>
        <h1>Mundo Afora</h1>
        <nav>
            <a href="https://google.com">Inicio</a>
            <a href="#">Destinos</a>
            <a href="#">Sobre</a>
        </nav>

    <!-- MAIN: Conteudo Principal, um por pagina -->
    <main>
        <h2>Ultimas publicações</h2>
        <!-- SECTION: Conteudo Relacionado (seções) -->
        <section>
            <article class="card">
                <h3>5 dias em Lisboa</h3>

            </article>
            <article class="card">
                <h3>5 dias em Budapeste</h3>
                <p>Um roteiro completo pelos bairros históricos, etc, e passeio de trem</p>
            </article>
            <img alt="Essa imagem representa a Torre Eiffel em Paris" src="./foto.png">
            <input type="number">
        </section>
    </main>
    <footer>
        <p>Copy: 2026 Mundo Afora Desenvolvimento</p>
    </footer>
</body>

</html>
