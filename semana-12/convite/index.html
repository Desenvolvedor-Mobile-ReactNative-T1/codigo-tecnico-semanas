<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar convite</title>
    <script type="importmap">
        {
            "imports": {
                "canvas-confetti": "./node_modules/canvas-confetti/dist/confetti.module.mjs"
            }
        }
    </script>
    <script type="module" src="js/formulario.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="cartao">
        <h1>Gerador de convite</h1>
        <p>Digite um nome. A outra página mostra o convite.</p>

        <form id="formulario">
            <label for="nome">Nome</label>
            <input id="nome" type="text" name="nome" placeholder="Ex: Matheus" autocomplete="name">
            <button type="submit">Gerar convite</button>
        </form>

        <p id="mensagem" aria-live="polite"></p>
    </main>
</body>

</html>
